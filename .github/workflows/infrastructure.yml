name: Infrastructure

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.ref }}
  # A newer push supersedes a pull request's run; runs on main always finish, so every commit is analysed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform:
    name: Terraform (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        stack: [bootstrap, base]

    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      # No backend and no AWS credentials: the tests run against a mocked provider.
      - name: Init
        run: terraform init -backend=false -lockfile=readonly -input=false

      - name: Validate
        run: terraform validate

      - name: Test
        run: terraform test

  trivy:
    name: Trivy (Terraform)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # Fails on any high or critical misconfiguration that is not ignored, with its reason, next
      # to the resource it concerns.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
