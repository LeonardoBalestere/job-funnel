name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, on Monday morning, to pick up new queries even when the code does not change.
    - cron: "27 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  # A newer push supersedes a pull request's run; runs on main always finish, so every commit is analysed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build
        run: dotnet build --configuration Release

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
