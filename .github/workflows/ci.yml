name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, style and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Warnings are errors through Directory.Build.props, so any analyzer or compiler warning fails here.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check style
        run: dotnet format --verify-no-changes --no-restore --verbosity diagnostic

      - name: Test
        run: dotnet test --no-build --configuration Release
